<html>
    <head>
        <title>
            114514
        </title>
        <style>
            h1 {
                /* color: red; */
                color: rgb(26, 42, 103);
                /* color #eeeeeeem; */
            }
            /* 使用元素选择器  */
            /* span {
                color: rgba(128, 128, 128, 0.485);
            } */
            /* 使用类选择器 */
            .cls{
                color: rgba(128, 128, 128, 0.485);
            }
            /* ID选择器(唯一性) */
            #小标题{
                color: aquamarine;
                font-size: 18px;/* 设置字体大小,也可以120%啥的 */
                
            }
        </style>
    </head>
    
    
    <body">
        <h1>欢迎使用Html</h1>
        <p/>
        <hr>
            <!--span是没有语义的标签,仅仅把同一行的不同语义的元素分开,使其分开CSS -->
            <span class="cls">2023.10.12</span>
            <span id="小标题">Hello World</span>
            <p/>
            你好
        </hr>
        
    </body>

</html>
